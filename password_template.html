<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Watch</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0e14;
    color: #e8eaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #151a23;
    border: 1px solid #232a36;
    border-radius: 16px;
    padding: 36px 32px;
    text-align: center;
  }
  .lock {
    width: 52px; height: 52px;
    margin: 0 auto 18px;
    border-radius: 14px;
    background: #1d2531;
    display: flex; align-items: center; justify-content: center;
    color: #7aa2f7;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  p.sub { font-size: 14px; color: #8b93a7; margin-bottom: 24px; }
  .row { position: relative; }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px 84px 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a3140;
    background: #0f1319;
    color: #e8eaf0;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #7aa2f7; }
  .toggle {
    position: absolute;
    right: 50px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: #8b93a7; font-size: 12px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .go {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    background: #7aa2f7; border: none;
    width: 38px; height: 38px;
    border-radius: 8px;
    color: #0b0e14; font-size: 17px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err {
    margin-top: 14px;
    color: #f7768e;
    font-size: 14px;
    min-height: 20px;
  }
  .hint { margin-top: 6px; font-size: 12px; color: #5c6474; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <h1>Company Watch</h1>
    <p class="sub">Unlock company research. No holdings or portfolio values are stored in this site.</p>
    <form id="f">
      <div class="row">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="button" class="toggle" id="tg">show</button>
        <button type="submit" class="go" id="go">&#8594;</button>
      </div>
    </form>
    <div class="err" id="err"></div>
    <div class="hint">AES-256-GCM encrypted &middot; decrypts only in your browser</div>
  </div>
<script>
(function () {
  var SALT = "__SALT__", IV = "__IV__", CT = "__CT__", ITER = __ITER__;
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var salt = b64(SALT), iv = b64(IV), ct = b64(CT);

  document.getElementById("tg").addEventListener("click", function () {
    var p = document.getElementById("pw");
    var show = p.type === "password";
    p.type = show ? "text" : "password";
    this.textContent = show ? "hide" : "show";
  });

  function fail(msg) {
    var e = document.getElementById("err");
    e.textContent = msg || "Wrong password.";
    var go = document.getElementById("go");
    go.disabled = false; go.innerHTML = "&#8594;";
    document.getElementById("pw").focus();
  }

  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var go = document.getElementById("go");
    go.disabled = true; go.textContent = "\u2026";
    document.getElementById("err").textContent = "";
    var pw = document.getElementById("pw").value;
    try {
      var km = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
      var bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: ITER }, km, 256);
      var key = await crypto.subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv, tagLength: 128 }, key, ct);
      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (ex) {
      fail("Wrong password or damaged page.");
    }
  });
})();
</script>
</body>
</html>
